name: Update routes

# Rebuilds web/static/routes/ from the latest gtfs.de feed (docs/routes.md) and
# opens a PR when anything changed. The raw feed (~300 MB) only ever lives on the
# runner. Never auto-merges — a broken export would otherwise go straight to prod.

on:
  schedule:
    - cron: "0 4 1 * *"   # 1st of every month, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download gtfs.de feed
        run: curl -sSfL --retry 3 -o latest.zip https://download.gtfs.de/germany/free/latest.zip

      - name: Build routes
        run: python scripts/build_routes.py latest.zip

      - name: Summarise changes
        id: summary
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          new = json.load(open("web/static/routes/index.json"))
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:web/static/routes/index.json"],
                                              capture_output=True, text=True, check=True).stdout)
          except subprocess.CalledProcessError:
              old = {"lines": {}}
          flat = lambda d: {f"{s}/{l}" for s, ls in d["lines"].items() for l in ls}
          added, removed = sorted(flat(new) - flat(old)), sorted(flat(old) - flat(new))
          parts = [f"added: {', '.join(added)}" if added else "", f"removed: {', '.join(removed)}" if removed else ""]
          print("text=" + ("; ".join(p for p in parts if p) or "same lines, updated stop sequences"))
          EOF

      - name: Commit on a new branch
        id: commit
        run: |
          git config user.name "frankfurt-radar-routes-bot"
          git config user.email "routes-bot@users.noreply.github.com"
          branch="routes/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add web/static/routes
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "routes: rebuild from gtfs.de ($(date -u +%Y-%m-%d))"
            git push --force origin "$branch"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "routes: monthly rebuild from gtfs.de ($(date -u +%Y-%m))" \
            --body "Auto-generated by the Update routes workflow. ${{ steps.summary.outputs.text }}. Spot-check a changed line on the map, then merge (or close). Never auto-merged." \
            --head "${{ steps.commit.outputs.branch }}"

      - name: No changes
        if: steps.commit.outputs.has_changes == 'false'
        run: echo "::notice::Routes unchanged since the last build — no PR opened."
